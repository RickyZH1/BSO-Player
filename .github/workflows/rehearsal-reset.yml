name: Verify rehearsal reset guide SQL
on:
  push:
    paths:
      - docs/manuals-v2/reset-files/**
      - tests/rehearsal-reset.mjs
      - .github/workflows/rehearsal-reset.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: bso_reset_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node tests/rehearsal-reset.mjs
        env:
          TEST_DATABASE_URL: postgres://postgres:test-only-password@localhost:5432/bso_reset_test
